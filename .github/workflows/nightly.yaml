name: Nightly

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    name: Build nightly assets
    uses: ./.github/workflows/_build.yml
    with:
      version: 0.0.0-nightly.${{ github.run_number }}
      agent_release_tag: nightly

  publish:
    name: Publish Nightly Release
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: beat-linux-*
          path: release-assets
          merge-multiple: true

      - name: Generate release manifest and checksums
        run: |
          set -euo pipefail
          tag="nightly"
          version="0.0.0-nightly.${GITHUB_RUN_NUMBER}"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          .github/scripts/generate-release-manifest.sh \
            release-assets "$GITHUB_REPOSITORY" "$tag" "$version" "$GITHUB_SHA" "$published_at"
          (
            cd release-assets
            sha256sum beat-server-linux-amd64 beat-server-linux-arm64 \
              beat-agent-linux-amd64 beat-agent-linux-arm64 beat-manifest.json > checksums.txt
            cat checksums.txt
          )

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag="nightly"
          notes="$(printf 'Temporary build from branch %s.\n\nCommit: %s\nRun: %s/%s/actions/runs/%s' \
            "$REF_NAME" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"

          gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly" \
            --notes "$notes" \
            release-assets/*
