name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      upload_frontend_artifact: true

  containers:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: combined
            package: beat
          - target: server
            package: beat-server
          - target: agent
            package: beat-agent
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: release-meta
        shell: bash
        run: |
          printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          printf 'build_date=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
      - name: Build and push ${{ matrix.target }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release-meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.release-meta.outputs.build_date }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=beat-image-${{ matrix.package }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign multi-architecture image manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Record image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
        run: |
          {
            printf '### %s container\n\n' "$TARGET"
            printf -- "- Image: \`%s\`\n" "$IMAGE"
            printf -- '- Digests: %s\n' "$DIGEST"
            printf -- "- Platforms: \`linux/amd64\`, \`linux/arm64\`\n"
          } >>"$GITHUB_STEP_SUMMARY"

  release:
    needs: [quality, containers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: beat-frontend-static
          path: webui/dist
      - name: Validate downloaded frontend bundle
        run: test -s webui/dist/index.html
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate artifacts and prepare signed Agent release
        run: scripts/prepare-release.sh dist
        env:
          BEAT_RELEASE_SIGNING_KEY: ${{ secrets.BEAT_RELEASE_SIGNING_KEY }}
          BEAT_RELEASE_KEY_ID: ${{ vars.BEAT_RELEASE_KEY_ID || 'beat-release' }}
      - name: Upload prepared release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/beat_*.tar.gz
            dist/beat_*.tar.gz.sbom.json
            dist/beat-agent_linux_amd64
            dist/beat-agent_linux_arm64
            dist/beat-agent-release-notes.txt
            dist/beat-agent-release-spec.json
            dist/beat-agent-manifest.json
            dist/beat-agent-manifest.sig
            dist/beat-agent-manifest.sigstore.json
            dist/checksums.txt
            dist/checksums.txt.bundle
      - name: Publish complete release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
