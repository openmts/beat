name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      upload_frontend_artifact: true

  release:
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: beat-frontend-static
          path: webui/dist
      - name: Validate downloaded frontend bundle
        run: test -s webui/dist/index.html
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate artifacts and prepare signed Agent release
        run: scripts/prepare-release.sh dist
        env:
          BEAT_RELEASE_SIGNING_KEY: ${{ secrets.BEAT_RELEASE_SIGNING_KEY }}
          BEAT_RELEASE_KEY_ID: ${{ vars.BEAT_RELEASE_KEY_ID || 'beat-release' }}
      - name: Upload prepared release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/beat_*.tar.gz
            dist/beat_*.tar.gz.sbom.json
            dist/beat-agent_linux_amd64
            dist/beat-agent_linux_arm64
            dist/beat-agent-release-notes.txt
            dist/beat-agent-release-spec.json
            dist/beat-agent-manifest.json
            dist/beat-agent-manifest.sig
            dist/beat-agent-manifest.sigstore.json
            dist/checksums.txt
            dist/checksums.txt.bundle
      - name: Publish complete release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
