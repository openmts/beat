name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  backend-static:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install quality tools
        run: |
          go install github.com/incu6us/goimports-reviser/v3@v3.12.6
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
      - name: Backend format, lint, security and build gate
        run: scripts/check.sh backend-static

  backend-tests:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      GOMAXPROCS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Backend tests and coverage gate
        run: scripts/check.sh backend-tests

  backend-race:
    name: Backend race shard ${{ matrix.shard }}/2
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      GOMAXPROCS: 2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Concurrent, atomic and snapshot race gate
        run: scripts/check.sh backend-race "${{ matrix.shard }}"

  backend-privileged:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      GOMAXPROCS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Root, cgroup and system SSH integration gate
        run: sudo --preserve-env=PATH,GOROOT,GOMAXPROCS scripts/check.sh backend-privileged

  frontend:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install theme gate browser dependencies
        run: |
          cd webui
          npm ci
          # 浏览器本体由 scripts/check.sh 装进仓库专用目录，这里只补系统依赖。
          npx playwright install-deps chromium
      - name: Complete frontend gate
        run: scripts/check.sh frontend

  deployment:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install workflow validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Deployment and release safety gate
        run: scripts/check.sh scripts

      - name: Theme build and distribution gate
        run: scripts/check.sh themes

  container:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test isolated rootless container
        run: scripts/check.sh container
