version: 2
project_name: beat

builds:
  - id: beat-server
    main: ./cmd/server
    binary: beat-server
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/beat/backend/internal/buildinfo.Version={{.Version}} -X github.com/beat/backend/internal/buildinfo.Commit={{.Commit}} -X github.com/beat/backend/internal/buildinfo.Date={{.Date}}
  - id: beat-agent
    main: ./cmd/agent
    binary: beat-agent
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/beat/backend/internal/buildinfo.Version={{.Version}} -X github.com/beat/backend/internal/buildinfo.Commit={{.Commit}} -X github.com/beat/backend/internal/buildinfo.Date={{.Date}}
  - id: beat-cli
    main: ./cmd/beat-cli
    binary: beat-cli
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/beat/backend/internal/buildinfo.Version={{.Version}} -X github.com/beat/backend/internal/buildinfo.Commit={{.Commit}} -X github.com/beat/backend/internal/buildinfo.Date={{.Date}}
  - id: beat-theme
    main: ./cmd/theme
    binary: beat-theme
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/beat/backend/internal/buildinfo.Version={{.Version}} -X github.com/beat/backend/internal/buildinfo.Commit={{.Commit}} -X github.com/beat/backend/internal/buildinfo.Date={{.Date}}

archives:
  - id: beat
    ids: [beat-server, beat-agent, beat-cli, beat-theme]
    formats: [tar.gz]
    name_template: "beat_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: webui/dist
        dst: static
      - README.md
      - deploy/**/*
      - scripts/beatctl.sh
      - scripts/state_archive.py

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
